name: ogb-jax-cu12
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # nice-to-haves / system libs for video + mujoco rendering
  - ffmpeg
  - glfw
  - glew
  - patchelf
  - numpy
  - matplotlib
  - pip:
      # JAX GPU (CUDA 12) prebuilt wheels + CUDA libs
      - "jax[cuda12]"
      # OGBench + its training deps from your reqs
      - ogbench
      - "flax>=0.8.4"
      - "distrax>=0.1.5"
      - ml-collections
      - moviepy
      - wandb
