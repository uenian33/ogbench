name: ogbench
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pip
  - pip:
      # Core OGBench dependencies
      - ogbench>=1.1.0
      - mujoco>=3.1.6
      - dm_control>=1.0.20
      - gymnasium>=0.29.1
      
      # JAX and related (for CUDA 12 support - adjust if needed)
      - jax[cuda12]>=0.4.26
      - jaxlib
      - flax>=0.8.0
      - optax>=0.1.9
      
      # Deep learning utilities
      - numpy<2.0.0
      - tensorflow-probability>=0.24.0
      - ml-collections>=0.1.1
      - distrax>=0.1.5
      
      # Image processing and rendering
      - pillow
      - imageio
      - imageio-ffmpeg
      - opencv-python
      
      # Logging and experiment tracking
      - wandb
      - tensorboard
      - tqdm
      
      # Data handling
      - h5py
      - zarr
      
      # Utilities
      - absl-py
      - pyyaml
      - matplotlib
      - seaborn